<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase I Historical Table Builder</title><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><style>
:root{font-family:Arial,sans-serif;color:#193044;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#173a50;color:white;padding:20px 30px}h1{margin:0;font-size:25px}main{padding:22px;max-width:1400px;margin:auto}section{background:white;padding:20px;border-radius:10px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h2{margin:0 0 16px}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{font:inherit;padding:9px;border:1px solid #aebcc8;border-radius:5px;width:100%;background:white}textarea{min-height:55px;resize:vertical}button{background:#116a88;color:white;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;font-weight:600;margin:8px 8px 8px 0}button.secondary{background:#526778}button.danger{background:#a83939}.property{border:1px solid #d8e2e8;padding:15px;margin:12px 0;border-radius:7px}.three{display:grid;grid-template-columns:1fr 2fr 2fr;gap:12px}.hidden{display:none!important}.toolbar{position:sticky;top:0;background:#f4f7fa;padding:10px 0;z-index:15}.table-wrap{overflow:auto;max-height:75vh;border:1px solid #bccbd4}table{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%;table-layout:fixed}td{border-right:1px solid #a5b2bb;border-bottom:1px solid #a5b2bb;padding:7px;vertical-align:top;overflow-wrap:anywhere;background:white}thead tr td{position:sticky;z-index:4;background:#e8eef4;font-weight:600}thead tr:nth-child(1) td{top:0}thead tr:nth-child(2) td{top:var(--h1,42px)}thead tr:nth-child(3) td{top:var(--h2,84px)}thead tr:nth-child(4) td{top:var(--h3,126px)}thead tr:nth-child(5) td{top:var(--h4,168px)}thead td{box-shadow:0 1px 0 #9caebc}td input,td textarea,td select{min-width:105px;padding:6px;font-size:13px}td textarea{min-height:76px}td:first-child{width:100px}td:nth-child(2){width:180px}td:nth-child(3){width:230px}.hint{color:#556b7b;font-size:13px}.status{padding:10px;color:#24556b}#tableSection{max-width:none} @media(max-width:750px){.three{grid-template-columns:1fr}main{padding:10px}}
</style></head><body><header><h1>Phase I Historical Table Builder</h1></header><main><div id="inputPage"><section><h2>Subject Property</h2><label for="sjpaddress">What is the subject property address (input all known full addresses separated by a semicolon)</label><textarea id="sjpaddress"></textarea><label for="sjpuse">What is the subject property use? (e.g. Retail gasoline service station)</label><input id="sjpuse"></section><section><h2>Adjoining Properties</h2><div id="properties"></div><button id="addProperty">Add adjoining property</button><p class="hint">The revised template has seven adjoining-property columns (D–J).</p></section><button id="populate">Populate Table</button><p id="inputStatus" class="status"></p></div><div id="builderPage" class="hidden"><div class="toolbar"><button id="back" class="secondary">Return to Inputs</button><button id="addRow">Add new row</button><button id="saveTop">SAVE EXCEL FILE</button></div><section id="tableSection"><h2>Table Builder</h2><div class="table-wrap"><table id="builderTable"><colgroup><col style="width:100px"><col style="width:180px"><col style="width:230px"><col span="7" style="width:200px"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><button id="addRowBottom">Add new row</button><button id="saveBottom">SAVE EXCEL FILE</button><p class="status" id="builderStatus"></p></section></div></main><script>
'use strict';const templateUrl='./template.xlsx';const sources=['City Directory','Aerial photograph','Topographic map','Sanborn Map','Newspaper listing','EDR Report','Building Permit','County Assessment Records','[OTHER]'];let workbook,worksheet,properties=[],entries=[];let nextId=1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function splitAddresses(s){return String(s||'').split(';').map(x=>x.trim()).filter(Boolean)}
function consolidate(s){const a=Array.isArray(s)?s:splitAddresses(s);const groups=[];for(const item of a){const m=item.match(/^\s*(\d+[A-Za-z-]*)\s+(.+?)\s*$/);if(!m){groups.push({plain:item});continue}const key=m[2].replace(/\s+/g,' ').trim().toLowerCase();let g=groups.find(g=>g.key===key);if(!g){g={key,suffix:m[2].trim(),numbers:[]};groups.push(g)}if(!g.numbers.some(n=>n.toLowerCase()===m[1].toLowerCase()))g.numbers.push(m[1])}return groups.map(g=>g.plain||g.numbers.join(', ')+' '+g.suffix).join('; ')}
function addProperty(data={}){if(properties.length>=7){$('inputStatus').textContent='The template supports up to seven adjoining properties.';return}properties.push({id:nextId++,dir:data.dir||'',address:data.address||'',use:data.use||''});renderProperties()}
function renderProperties(){const root=$('properties');root.innerHTML=properties.map((p,i)=>`<div class="property" data-id="${p.id}"><h3>Adjoining Property ${i+1}</h3><div class="three"><div><label>Adjoining Direction (Only input direction e.g. ‘North’)</label><input data-field="dir" value="${esc(p.dir)}"></div><div><label>Address(es) (input all known full addresses separated by a semicolon)</label><textarea data-field="address">${esc(p.address)}</textarea></div><div><label>Current use(s) (e.g. Retail gasoline service station)</label><input data-field="use" value="${esc(p.use)}"></div></div><button class="danger" data-remove="${p.id}">Remove adjoining property</button></div>`).join('');root.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{const p=properties.find(x=>x.id===Number(el.closest('.property').dataset.id));p[el.dataset.field]=el.value}));root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{properties=properties.filter(p=>p.id!==Number(b.dataset.remove));renderProperties()})}
async function loadTemplate(){if(!window.ExcelJS)throw Error('ExcelJS could not load. Check your internet connection.');const response=await fetch(templateUrl);if(!response.ok)throw Error('Cannot load template.xlsx. Run this site on a web server (such as GitHub Pages), with template.xlsx beside index.html.');const buffer=await response.arrayBuffer();workbook=new ExcelJS.Workbook();await workbook.xlsx.load(buffer);worksheet=workbook.worksheets[0];if(!worksheet)throw Error('Template contains no worksheet.')}
function setCell(address,value){worksheet.getCell(address).value=value}
function applyHeaders(){setCell('C3',consolidate(splitAddresses($('sjpaddress').value)));setCell('C4',$('sjpuse').value.trim());for(let i=0;i<7;i++){const col=String.fromCharCode(68+i),p=properties[i];setCell(col+'2',p?(p.dir.trim()?p.dir.trim()+'-Adjoining Property':'-Adjoining Property'):'');setCell(col+'3',p?consolidate(splitAddresses(p.address)):'');setCell(col+'4',p?p.use.trim():'')}}
function renderHeader(){const header=$('thead');header.innerHTML='';const row1=document.createElement('tr');[['Date',1,4],['Source',1,4],['Subject Property',1,2],['Adjoining Properties',7,1]].forEach(([t,c,r])=>{const td=document.createElement('td');td.textContent=t;td.colSpan=c;td.rowSpan=r;row1.append(td)});header.append(row1);for(let r=2;r<=5;r++){const tr=document.createElement('tr');if(r===3||r===4){const td=document.createElement('td');td.textContent=String(worksheet.getCell('C'+r).value??'');tr.append(td)}if(r===5){for(let c=1;c<=3;c++){const td=document.createElement('td');td.textContent=String(worksheet.getCell(r,c).value??'');tr.append(td)}}for(let c=4;c<=10;c++){const td=document.createElement('td');td.textContent=String(worksheet.getCell(r,c).value??'');tr.append(td)}header.append(tr)}requestAnimationFrame(()=>{let sum=0;const rows=[...header.rows];rows.forEach((r,i)=>{if(i<4){sum+=r.getBoundingClientRect().height;document.documentElement.style.setProperty('--h'+(i+1),sum+'px')}})})}
function renderEntries(){const body=$('tbody');body.innerHTML='';entries.forEach((e,i)=>{const tr=document.createElement('tr');const fields=['date','source','sjpdescription',...Array.from({length:7},(_,j)=>'description'+(j+1))];fields.forEach(f=>{const td=document.createElement('td');let el;if(f==='source'){el=document.createElement('select');for(const opt of ['',...sources]){const o=document.createElement('option');o.value=opt;o.textContent=opt||'Select source';el.append(o)}el.value=e[f]||''}else if(f==='date'){el=document.createElement('input');el.type='number';el.step='1';el.placeholder='Year';el.value=e[f]??''}else{el=document.createElement('textarea');el.value=e[f]??'';if(f.startsWith('description')&&Number(f.slice(11))>properties.length)el.placeholder='No adjoining property assigned'}el.addEventListener('input',()=>e[f]=el.value);td.append(el);tr.append(td)});const td=document.createElement('td');const b=document.createElement('button');b.textContent='Remove';b.className='danger';b.onclick=()=>{entries.splice(i,1);renderEntries()};td.append(b);tr.append(td);body.append(tr)})}
function addEntry(data={}){entries.push({date:'',source:'',sjpdescription:'',...Object.fromEntries(Array.from({length:7},(_,i)=>['description'+(i+1),''])),...data});renderEntries()}
function showBuilder(){applyHeaders();renderHeader();renderEntries();$('inputPage').classList.add('hidden');$('builderPage').classList.remove('hidden');window.scrollTo(0,0)}
function excelVal(value){const s=String(value??'').trim();return s.startsWith('=')?"'"+s:s}
async function save(){const status=$('builderStatus');try{status.textContent='Preparing workbook…';applyHeaders();const start=6;const count=entries.length;const existing=Math.max(0,worksheet.rowCount-5);if(count>existing){for(let i=0;i<count-existing;i++){const nr=worksheet.getRow(start+existing+i);for(let c=1;c<=10;c++){const base=worksheet.getRow(6).getCell(c);nr.getCell(c).style=JSON.parse(JSON.stringify(base.style));}nr.height=worksheet.getRow(6).height}}for(let i=0;i<count;i++){const r=start+i,e=entries[i];const row=worksheet.getRow(r);const date=String(e.date??'').trim();row.getCell(1).value=date===''?null:Number(date);row.getCell(2).value=excelVal(e.source)||null;row.getCell(3).value=excelVal(e.sjpdescription)||null;for(let j=0;j<7;j++)row.getCell(j+4).value=excelVal(e['description'+(j+1)])||null;row.commit()}const removeFrom=start+count;const removeCount=Math.max(0,worksheet.rowCount-removeFrom+1);if(removeCount)worksheet.spliceRows(removeFrom,removeCount);worksheet.views=[{state:'frozen',ySplit:5}];const data=await workbook.xlsx.writeBuffer();const blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});if(window.showSaveFilePicker){try{const handle=await window.showSaveFilePicker({suggestedName:'Phase_I_Historical_Table.xlsx',types:[{description:'Excel workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});const writer=await handle.createWritable();await writer.write(blob);await writer.close();status.textContent='Excel file saved.';return}catch(err){if(err.name==='AbortError'){status.textContent='Save cancelled.';return}/* browser picker unavailable or blocked: download instead */}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Phase_I_Historical_Table.xlsx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);status.textContent='Excel file downloaded. Choose its location using your browser download settings.'}catch(err){status.textContent='Save failed: '+err.message;console.error(err)}}
$('addProperty').onclick=()=>addProperty();$('populate').onclick=async()=>{try{$('inputStatus').textContent='Loading template…';if(!workbook)await loadTemplate();showBuilder();$('inputStatus').textContent=''}catch(e){$('inputStatus').textContent=e.message}};$('back').onclick=()=>{$('builderPage').classList.add('hidden');$('inputPage').classList.remove('hidden')};$('addRow').onclick=$('addRowBottom').onclick=()=>addEntry();$('saveTop').onclick=$('saveBottom').onclick=save;addProperty();
</script></body></html>
